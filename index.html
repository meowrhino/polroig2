<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Pol Roig Valldosera · dissenyador d'espai">
  <title>pol roig</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" id="favicon" type="image/webp" href="">
</head>
<body>

  <header class="top">
    <a class="logo" href="#/bio/">pol roig</a>
    <div class="lang">
      <button class="lang__toggle" aria-haspopup="listbox" aria-expanded="false">
        <span class="lang__current">cat</span>
      </button>
      <ul class="lang__menu" role="listbox" hidden>
        <li><a data-lang="cat" href="#">cat</a></li>
        <li><a data-lang="es"  href="#">es</a></li>
        <li><a data-lang="en"  href="#">en</a></li>
      </ul>
    </div>
  </header>

  <main class="home view" id="view-home" hidden>
    <div class="home__stage">
      <a class="mirilla" id="mirilla-link" href="#/">
        <img class="mirilla__img" alt="" />
        <span class="mirilla__iris" aria-hidden="true"></span>
      </a>
    </div>

    <aside class="home__side">
      <nav class="cloud" id="cloud" data-i18n-aria-label="lista_proyectos" aria-label="llista de projectes"></nav>
      <section class="project-info">
        <p class="synopsis"></p>
        <p class="bio-frag"></p>
      </section>
    </aside>
  </main>

  <main class="proyecto view" id="view-project" hidden>
    <article class="proyecto__article">
      <header class="proyecto__head">
        <h1 class="proyecto__title"></h1>
        <p class="proyecto__sub"></p>
      </header>
      <div class="proyecto__mirilla">
        <img class="mirilla__img" alt="" />
      </div>
      <p class="proyecto__synopsis"></p>
      <p class="proyecto__text"></p>
      <ul class="proyecto__creditos"></ul>
      <div class="proyecto__gallery"></div>
      <a class="proyecto__back" href="#/" data-i18n="volver"></a>
    </article>
  </main>

  <noscript>
    <p style="padding:1rem;color:#fff">Per veure el portfolio cal JavaScript.</p>
  </noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
